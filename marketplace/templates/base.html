 {% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}ClearSpace Local{% endblock %}</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"> 

  {% block extra_head %}{% endblock %}
</head>

<body>

  <nav class="navbar">
    
    <a class="nav-link" href="/">Home</a>

    <details class="nav-item">
      <summary class="nav-link">About</summary>
      
      <div class="dropdown">
        <a href="/about/" class="dropdown-link">Our Mission</a>
        <a href="/team/" class="dropdown-link">Team</a>
      
      </div>
    </details>

    <details class="nav-item">
      <summary class="nav-link">Services</summary>
      <div class="dropdown">
        <a href="/services/concrete/" class="dropdown-link">Concrete</a>
        <a href="/services/landscaping/" class="dropdown-link">Landscaping</a>
        <a href="/cleaning/" class="dropdown-link">Cleaning</a>
      </div>
    </details>

    <a class="nav-link" href="/contact/">Contact</a>
  </nav> 

  <div class="hero"></div>


  <!-------------------------------------------------------------------------------->
  <!-------------------------------------------------------------------------------->
  <main>
    {% block content %}
    {% endblock %}
  </main>

</body>
</html>
